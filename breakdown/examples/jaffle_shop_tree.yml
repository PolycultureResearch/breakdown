# breakdown: jaffle-shop Bayesian Metric Tree
# This example maps to the standard jaffle-shop semantic layer metrics

provider:
  type: mock # options: mock, local, cloud
  # project_path: "/path/to/jaffle-shop" # only for type: local

metrics:
  - name: daily_sessions
    description: "Total count of website sessions per day"
    source: jaffle_shop.metrics.sessions
    format:
      style: number
      unit: sessions
      decimals: 0

  - name: order_count
    description: "Total number of orders placed"
    source: jaffle_shop.metrics.order_count
    format:
      style: number
      unit: orders / day
      decimals: 0
    parents:
      - daily_sessions
    priors:
      coefficient:
        distribution: "Normal"
        params: { mu: 0.1, sigma: 0.02 } # Expecting ~10% conversion from session to order

  - name: average_order_value
    description: "Average revenue per order"
    source: jaffle_shop.metrics.average_order_value
    # An average, so it never auto-aggregates: the mean of a week of daily
    # AOVs is not the week's AOV, which must be recomputed from its components.
    kind: rate
    # An order value is revenue *per order*, so a window's AOV is
    # Σrevenue / Σorder_count. `revenue = order_count * average_order_value`
    # below says the same thing from the other side.
    denominator: order_count
    format: currency

  - name: revenue
    description: "Total revenue"
    source: jaffle_shop.metrics.revenue
    format: currency
    formula: "order_count * average_order_value"
    parents:
      - order_count
      - average_order_value
    # Only declare seasonality the fit window can actually see: two full
    # periods, minimum. An annual component (period: 365) on a few months of
    # data is unidentifiable and soaks up degrees of freedom the parents need.
    seasonality:
      - period: 7
        name: "weekly"
