name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/ -q

      # Keep the install story honest: the wheel must build, expose the
      # console script, and ship the UI + bundled example tree.
      - name: Build wheel
        run: uv build

      - name: Smoke-test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl breakdown --help
          uv run --isolated --no-project --with dist/*.whl python -c "
          from importlib.resources import files
          pkg = files('breakdown')
          assert pkg.joinpath('static/index.html').is_file(), 'UI missing from wheel'
          assert pkg.joinpath('examples/jaffle_shop_tree.yml').is_file(), 'example tree missing from wheel'
          "
