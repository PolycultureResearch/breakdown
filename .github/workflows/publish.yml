name: Publish

# Publishes `metric-breakdown` to PyPI via Trusted Publishing (OIDC) — no API
# tokens stored in the repo. Two paths:
#   * Publish a GitHub Release  -> builds and uploads to PyPI.
#   * Run the workflow manually  -> builds and uploads to TestPyPI (a dry run).
#
# One-time setup on PyPI/TestPyPI (Account -> Publishing -> Add a pending
# publisher), matching these values exactly:
#   PyPI:     project metric-breakdown, owner PolycultureResearch, repo breakdown,
#             workflow publish.yml, environment pypi
#   TestPyPI: same, environment testpypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # Keep the install story honest: the wheel must build, expose the console
      # script, and ship the UI + bundled example tree.
      #
      # `working-directory` is load-bearing, not tidiness. Run this from the
      # repo root and Python puts the checkout on sys.path, so `import
      # breakdown` resolves to the *source tree* and every assertion below
      # passes whether or not the wheel contains anything. Running from
      # elsewhere is what makes it a test of the artifact.
      - name: Smoke-test wheel
        working-directory: ${{ runner.temp }}
        run: |
          WHL=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          uv run --isolated --no-project --with "$WHL" breakdown --help
          uv run --isolated --no-project --with "$WHL" python - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files
          import os

          pkg = files("breakdown")
          # Proves we are inspecting the installed wheel, not a checkout.
          assert "site-packages" in str(pkg), f"not testing the wheel: imported from {pkg}"

          assert pkg.joinpath("static/index.html").is_file(), "UI missing from wheel"
          assert pkg.joinpath("examples/jaffle_shop_tree.yml").is_file(), "example tree missing from wheel"
          assert pkg.joinpath("py.typed").is_file(), "py.typed missing — the Typing :: Typed classifier would be a lie"

          # Published under a different name than it imports; assert both, since
          # a mismatch here is exactly what Trusted Publishing rejects.
          assert distribution("metric-breakdown").metadata["Name"] == "metric-breakdown"

          # The demo instance is a repo asset, not a dependency of the library.
          assert not os.path.isdir(os.path.join(str(pkg), "..", "demo")), "demo/ leaked into the wheel"
          print("wheel OK:", pkg)
          PY

      - name: Check metadata renders on PyPI
        run: uv run --isolated --no-project --with twine twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Manual runs go to TestPyPI so a release can be rehearsed end to end.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # A published GitHub Release ships the real thing.
  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The Claude Desktop extension rides the same release: build the .mcpb
  # bundle (see packaging/mcpb/) and attach it as a release asset, stamping
  # its manifest version from the release tag so it cannot go stale.
  bundle-mcpb:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp manifest version from the release tag
        working-directory: packaging/mcpb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = process.argv[1];
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          " "$VERSION"

      - name: Build the bundle
        working-directory: packaging/mcpb
        run: |
          npm ci --omit=dev
          npx -y @anthropic-ai/mcpb validate manifest.json
          npx -y @anthropic-ai/mcpb pack . breakdown.mcpb

      # The bundled entry script must actually bridge stdio to a breakdown
      # server before it ships. tools/list through the real vendored proxy
      # against a served instance (the bundled mock tree, no provider) is the
      # smallest end-to-end proof.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0

      - name: Smoke-test the bridge
        run: |
          uv run --isolated --no-project --with . breakdown serve --port 9090 >/tmp/serve.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:9090/health 2>/dev/null | grep -q '"ok"' && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9090/health | grep -q '"ok"' || { cat /tmp/serve.log; exit 1; }
          node - <<'JS'
          const { spawn } = require("child_process");
          const p = spawn("node", ["packaging/mcpb/server/index.js"], {
            env: { ...process.env, BREAKDOWN_MCP_URL: "http://127.0.0.1:9090/mcp" },
          });
          let out = "";
          p.stdout.on("data", (d) => (out += d));
          const send = (m) => p.stdin.write(JSON.stringify(m) + "\n");
          send({ jsonrpc: "2.0", id: 1, method: "initialize", params: {
            protocolVersion: "2025-06-18", capabilities: {},
            clientInfo: { name: "ci", version: "0" } } });
          setTimeout(() => {
            send({ jsonrpc: "2.0", method: "notifications/initialized" });
            send({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} });
          }, 5000);
          setTimeout(() => {
            const ok = out.includes('"run_rca"');
            console.log(ok ? "bridge OK" : "bridge FAILED\n" + out.slice(-2000));
            p.kill();
            process.exit(ok ? 0 : 1);
          }, 30000);
          JS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" packaging/mcpb/breakdown.mcpb --clobber
