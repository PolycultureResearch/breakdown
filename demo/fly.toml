# Fly.io deployment for the White Cube demo.
#
# **Always run these from the repo root**, never from demo/:
#
#   fly launch --no-deploy --copy-config --config demo/fly.toml --name white-cube-demo
#   fly secrets set BREAKDOWN_API_TOKEN=… --app white-cube-demo
#   fly deploy . --config demo/fly.toml --ha=false
#
# Then warm the trace cache once, so the first visitor does not pay for the fits:
#   uv run python demo/prewarm.py --rcas --url https://white-cube-demo.fly.dev
#
# Two different paths are in play, and they resolve against different roots —
# which is worth stating because Fly's own docs get it backwards:
#
#   * `dockerfile` below resolves **relative to this file's directory**, so
#     "Dockerfile" means demo/Dockerfile. (Writing "demo/Dockerfile" here fails
#     with demo/demo/Dockerfile — verified, not theorised.)
#   * The **build context** is `fly deploy`'s WORKING_DIRECTORY argument, which
#     defaults to the shell's cwd. It must be the repo root, because the
#     Dockerfile installs the package from pyproject.toml/uv.lock and copies
#     breakdown/. Passing `.` from the repo root pins it explicitly rather than
#     relying on where you happened to be standing.

app = "white-cube-demo"
primary_region = "iad"

[build]
  # Relative to this file: demo/Dockerfile. Not the repo's root Dockerfile,
  # which is the general-purpose image expecting a tree mounted at
  # /config/tree.yml and shipping no snapshots.
  dockerfile = "Dockerfile"

[env]
  # MCP responses embed report_url deep links; without this they would point
  # at 127.0.0.1 and be useless to the person reading them.
  BREAKDOWN_PUBLIC_URL = "https://white-cube-demo.fly.dev"

[http_service]
  internal_port = 9090
  force_https = true
  auto_start_machines = true

  # Suspend, not stop. Suspend snapshots RAM, so an idle machine wakes in about
  # a second *with the pre-warmed trace cache intact*. Stopping would cold-boot
  # and re-fit on the first click — the one latency risk in a live pitch, since
  # fits are serialized behind a single lock.
  auto_stop_machines = "suspend"

  # Zero idle cost while the demo is invite-only. Raise to 1 before a scheduled
  # call, or permanently once traffic justifies it.
  #
  # This is *not* the machine-count control, despite flyctl printing "set
  # min_machines_running = 0" when it creates a spare for HA. It only sets how
  # many stay running under autostop. Nothing in fly.toml sets the count — that
  # is `fly scale count`, and `--ha=false` on deploy is what stops a fresh app
  # from being given two in the first place. Two machines would be actively
  # wrong here: the trace cache is per-process and in-memory, so prewarming one
  # leaves the other cold and analyses would be fast or slow at random.
  min_machines_running = 0

  [http_service.concurrency]
    # Fits are CPU-bound and serialized, so queueing many concurrent analyses on
    # one machine helps nobody. Spill to a second machine instead.
    type = "requests"
    soft_limit = 8
    hard_limit = 20

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # PyMC + pytensor's runtime C compilation want the headroom; 1GB OOMs mid-fit.
  size = "shared-cpu-2x"
  memory = "2gb"
