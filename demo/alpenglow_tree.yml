# Alpenglow Supply Co. — a benchmark tree for the second fake_companies
# vertical (retail_dtc), written for the calibration study in
# knowledge/innovation_rca_design.md §6.4. It is NOT a served demo:
# demo/demos.yaml still says `tree: null` for Alpenglow, and nothing here has
# been through the guided-tour treatment white_cube_tree.yml got (formats,
# slices, a UI pass).
#
# Alpenglow is a direct-to-consumer apparel brand. The data is synthetic,
# generated by fake_companies from configs/alpenglow_retail_dtc.yaml; every
# anomaly in it was planted, and `alpenglow.ground_truth.json` is the key.
#
# Where it comes from. Every series is committed as a parquet snapshot in
# demo/.breakdown/alpenglow_snapshots, fetched once over 2024-06-01 to
# 2026-05-31, so the benchmark (knowledge/benchmarks/innovation_score.py
# --company alpenglow) replays them and never opens the duckdb. The `dbt`
# provider is still constructed at load and reads its project to do that, so
# ALPENGLOW_DBT_PROJECT has to name a real fake_companies dbt/retail_dtc
# (dbt_project.yml, profiles.yml, target/semantic_manifest.json) even then.
# To refetch:
# `python demo/fetch_demo_data.py alpenglow` downloads alpenglow.duckdb (raw
# tables, dbt marts already built), and the `dbt` provider reads
# fake_companies' dbt/retail_dtc project (its target/semantic_manifest.json
# and profiles.yml, which names the duckdb through $FAKE_DB) and generates
# the SQL in process:
#
#   ALPENGLOW_DBT_PROJECT=/path/to/fake_companies/dbt/retail_dtc \
#   FAKE_DB=/path/to/alpenglow.duckdb DBT_PROFILES_DIR=$ALPENGLOW_DBT_PROJECT \
#   breakdown serve --tree demo/alpenglow_tree.yml \
#     --start-date 2024-06-01 --end-date 2026-05-31 \
#     --snapshot-dir demo/.breakdown/alpenglow_snapshots --refresh
#
# How it differs from fake_companies/examples/breakdown_alpenglow_tree.yml,
# the scenario tree it started from. That tree is nine flows in a chain. This
# one keeps its spine (spend -> sessions -> orders -> revenue, less discounts
# and refunds) and adds what the study needs and the business has:
#
#   - the three rates the planted anomalies enter through (conversion_rate,
#     return_rate, aov), with the identities that make them exact edges;
#   - sessions split into bought (paid) and earned (organic, email, direct),
#     because only the bought ones respond to spend;
#   - orders split into first orders and repeat orders, and the customer base
#     (a stock) that repeat orders come from.
#
# Eight nodes carry their own `bind:`: five are not dbt metrics, and three
# are dbt ratio metrics, which the `dbt` provider does not serve as a series.
# In this data a session converts at most once and a conversion is always a
# customer's first order, so converting_sessions is the count of new
# customers (the dbt metric `new_customers` agrees with it on all but a
# handful of days).

provider:
  type: dbt
  project_path: "${ALPENGLOW_DBT_PROJECT}"

metrics:
  # ------------------------------------------------------------- acquisition
  - name: marketing_spend
    description: "Ad-platform spend, paid search plus paid social"
    source: alpenglow.metrics.marketing_spend
    direction: neutral
    format: currency
    seasonality:
      - { period: 7, name: weekly }
      - { period: 365, name: annual }

  - name: paid_sessions
    description: "Sessions from paid search and paid social"
    source: alpenglow.metrics.paid_sessions
    direction: up_is_good
    parents: [marketing_spend]
    expected_signs: { marketing_spend: positive }
    seasonality:
      - { period: 7, name: weekly }
    # Not a dbt metric: `sessions` filtered to two channels.
    bind:
      sql: >-
        SELECT session_id, session_date,
        CASE WHEN channel IN ('paid_search', 'paid_social') THEN 1 ELSE 0 END AS n
        FROM main_marts.fct_sessions
      grain_key: session_id
      time_column: session_date
      agg: sum
      measure: n

  - name: organic_sessions
    description: "Sessions from organic search"
    source: alpenglow.metrics.organic_sessions
    direction: up_is_good
    seasonality:
      - { period: 7, name: weekly }
      - { period: 365, name: annual }
    bind:
      sql: >-
        SELECT session_id, session_date,
        CASE WHEN channel = 'organic' THEN 1 ELSE 0 END AS n
        FROM main_marts.fct_sessions
      grain_key: session_id
      time_column: session_date
      agg: sum
      measure: n

  - name: email_sessions
    description: "Sessions from email"
    source: alpenglow.metrics.email_sessions
    direction: up_is_good
    seasonality:
      - { period: 7, name: weekly }
      - { period: 365, name: annual }
    bind:
      sql: >-
        SELECT session_id, session_date,
        CASE WHEN channel = 'email' THEN 1 ELSE 0 END AS n
        FROM main_marts.fct_sessions
      grain_key: session_id
      time_column: session_date
      agg: sum
      measure: n

  - name: direct_sessions
    description: "Sessions arriving directly"
    source: alpenglow.metrics.direct_sessions
    direction: up_is_good
    seasonality:
      - { period: 7, name: weekly }
      - { period: 365, name: annual }
    bind:
      sql: >-
        SELECT session_id, session_date,
        CASE WHEN channel = 'direct' THEN 1 ELSE 0 END AS n
        FROM main_marts.fct_sessions
      grain_key: session_id
      time_column: session_date
      agg: sum
      measure: n

  - name: sessions
    description: "Web sessions, bought and earned"
    source: alpenglow.metrics.sessions
    direction: up_is_good
    formula: "paid_sessions + organic_sessions + email_sessions + direct_sessions"
    parents: [paid_sessions, organic_sessions, email_sessions, direct_sessions]

  - name: conversion_rate
    description: "Share of sessions that place an order"
    source: alpenglow.metrics.conversion_rate
    kind: rate
    direction: up_is_good
    denominator: sessions
    share: true
    seasonality:
      - { period: 7, name: weekly }
    # dbt declares this as a ratio metric, which the `dbt` provider turns into
    # an edge, not a series; the binding states the same ratio over the same
    # model.
    bind:
      sql: >-
        SELECT session_id, session_date, 1 AS n,
        CASE WHEN customer_id IS NOT NULL THEN 1 ELSE 0 END AS converted
        FROM main_marts.fct_sessions
      grain_key: session_id
      time_column: session_date
      agg: ratio
      numerator: converted
      denominator: n

  - name: converting_sessions
    description: "Sessions that placed an order. Each one is a customer's first order"
    source: alpenglow.metrics.converting_sessions
    direction: up_is_good
    formula: "sessions * conversion_rate"
    parents: [sessions, conversion_rate]

  # ------------------------------------------------------------------ repeat
  - name: customer_base
    description: "Customers acquired to date"
    source: alpenglow.metrics.customer_base
    kind: stock
    direction: up_is_good
    # Not a dbt metric: the running total of `new_customers`. One row a day,
    # already reduced, so `sum` at day grain reads the day's value.
    bind:
      sql: >-
        SELECT created_date AS day_id, created_date,
        SUM(COUNT(*)) OVER (ORDER BY created_date) AS customers
        FROM main_marts.dim_customers GROUP BY created_date
      grain_key: day_id
      time_column: created_date
      agg: sum
      measure: customers

  - name: returning_customer_orders
    description: "Orders from existing customers"
    source: alpenglow.metrics.returning_customer_orders
    direction: up_is_good
    parents: [customer_base]
    expected_signs: { customer_base: positive }
    seasonality:
      - { period: 7, name: weekly }

  - name: orders
    description: "Orders placed, first and repeat"
    source: alpenglow.metrics.orders
    direction: up_is_good
    formula: "converting_sessions + returning_customer_orders"
    parents: [converting_sessions, returning_customer_orders]

  # ----------------------------------------------------------------- revenue
  - name: aov
    description: "Average order value, before discounts"
    source: alpenglow.metrics.aov
    kind: rate
    direction: up_is_good
    denominator: orders
    format: currency
    bind:
      sql: SELECT order_id, order_date, gross_amount, 1 AS n FROM main_marts.fct_orders
      grain_key: order_id
      time_column: order_date
      agg: ratio
      numerator: gross_amount
      denominator: n

  - name: gross_revenue
    description: "Merchandise revenue before discounts and refunds"
    source: alpenglow.metrics.gross_revenue
    direction: up_is_good
    format: currency
    formula: "orders * aov"
    parents: [orders, aov]

  - name: discounted_orders
    description: "Orders that used a promo code. Zero outside a promotion"
    source: alpenglow.metrics.discounted_orders
    direction: neutral
    # Not a dbt metric: `orders` filtered to those with a discount.
    bind:
      sql: >-
        SELECT order_id, order_date,
        CASE WHEN discount_amount > 0 THEN 1 ELSE 0 END AS n
        FROM main_marts.fct_orders
      grain_key: order_id
      time_column: order_date
      agg: sum
      measure: n

  - name: discounts
    description: "Promo discounts given"
    source: alpenglow.metrics.discounts
    direction: down_is_good
    format: currency
    parents: [discounted_orders]
    expected_signs: { discounted_orders: positive }

  # ----------------------------------------------------------------- returns
  - name: units
    description: "Units sold"
    source: alpenglow.metrics.units
    direction: up_is_good
    parents: [orders]
    expected_signs: { orders: positive }
    seasonality:
      - { period: 7, name: weekly }

  - name: return_rate
    description: "Units returned per unit sold, both counted in their own week"
    source: alpenglow.metrics.return_rate
    grain: week
    kind: rate
    direction: down_is_good
    denominator: units
    # The dbt ratio's two sides live on different models (returns by request
    # date, order lines by order date), so the binding stacks them.
    bind:
      sql: >-
        SELECT 'r' || return_id AS row_id, request_date AS day, quantity AS returned, 0 AS sold
        FROM main_marts.fct_returns
        UNION ALL
        SELECT 'o' || order_item_id, order_date, 0, quantity
        FROM main_marts.fct_order_items
      grain_key: row_id
      time_column: day
      agg: ratio
      numerator: returned
      denominator: sold

  - name: returned_units
    description: "Units returned, dated by the return request"
    source: alpenglow.metrics.returned_units
    grain: week
    direction: down_is_good
    formula: "units * return_rate"
    parents: [units, return_rate]

  - name: refunds
    description: "Refund value of returns"
    source: alpenglow.metrics.refunds
    grain: week
    direction: down_is_good
    format: currency
    parents: [returned_units]
    expected_signs: { returned_units: positive }

  # -------------------------------------------------------------------- apex
  - name: net_revenue
    description: "Gross revenue less discounts and refunds"
    direction: up_is_good
    format: currency
    grain: week
    formula: "gross_revenue - discounts - refunds"
    parents: [gross_revenue, discounts, refunds]
