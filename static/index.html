<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>breakdown — Bayesian Metric Trees</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="brand">break<span>down</span></div>

        <div class="control-group">
            <label for="target-select">Target</label>
            <select id="target-select"></select>
        </div>

        <div class="control-group">
            <label>Reference</label>
            <input type="date" id="ref-start">
            <input type="date" id="ref-end">
        </div>

        <div class="control-group">
            <label>Analysis</label>
            <input type="date" id="an-start">
            <input type="date" id="an-end">
        </div>

        <button id="run-rca" class="primary">Run RCA</button>
        <button id="clear-rca" style="display:none">Clear</button>

        <div id="status"></div>
    </header>

    <div id="main">
        <div id="canvas-wrap">
            <div id="cy"></div>
            <div id="legend">
                <div class="legend-row"><span class="swatch source"></span> source metric</div>
                <div class="legend-row"><span class="swatch prob"></span> probabilistic</div>
                <div class="legend-row"><span class="swatch formula"></span> formula</div>
                <div class="legend-row"><span class="swatch fitted"></span> model fitted</div>
                <div class="legend-row"><span class="edge-swatch formula"></span> deterministic edge</div>
                <div class="legend-row"><span class="edge-swatch dashed"></span> learned edge</div>
                <div class="legend-row rca-only" style="display:none"><span class="swatch up"></span> moved up</div>
                <div class="legend-row rca-only" style="display:none"><span class="swatch down"></span> moved down</div>
            </div>
        </div>

        <div id="sidebar">
            <div id="tabs">
                <div class="tab active" data-tab="metric">Metric</div>
                <div class="tab" data-tab="rca">Root cause</div>
            </div>
            <div id="tab-metric" class="tab-content active">
                <p class="placeholder">Click a node to inspect a metric.</p>
            </div>
            <div id="tab-rca" class="tab-content">
                <p class="placeholder">Pick a target and two windows above, then Run RCA.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
