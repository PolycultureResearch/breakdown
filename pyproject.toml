[project]
# Distribution name only. `breakdown` is taken on PyPI, so the project is
# published as `metric-breakdown` — but the import package stays `breakdown`
# and so does the CLI, because that is what the docs, the API and every tree
# YAML already say. A distribution name differing from its import name is
# ordinary (scikit-learn/sklearn, beautifulsoup4/bs4); the only cost is that
# `pip install` and `import` read differently, which the README now states up
# front.
name = "metric-breakdown"
version = "0.1.0"
description = "Bayesian metric trees: root cause analysis for business metrics over the dbt Semantic Layer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Polyculture Research" }]
keywords = [
    "analytics",
    "attribution",
    "bayesian",
    "causal-inference",
    "dbt",
    "metric-tree",
    "root-cause-analysis",
    "semantic-layer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
# The base install is the whole engine, API, UI, MCP server and the `mock`
# provider — the "just let me try it" path. Provider SDKs are extras (below),
# because carrying dbt-core and the Databricks connector for everyone tripled
# the install for dependencies most users never touch.
dependencies = [
    "arviz<1.0.0",
    "fastapi>=0.135.2",
    "mcp>=2.0.0",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=15.0.0",
    "pydantic>=2.12.5",
    "pymc>=5.28.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.42.0",
]

# Provider SDKs. Each one is needed only by the provider that uses it, and
# selecting a provider without its extra raises an error naming the exact
# `pip install` to run (breakdown/data_fetch.py) rather than an ImportError.
#
# `dbt` is also where the Python-version ceiling lives: dbt-core does not run on
# 3.14 (`mf` dies on import with a mashumaro serialization error). It is left
# unmarked rather than pinned to <3.14 so that failure stays visible: a marker
# would make `pip install 'metric-breakdown[dbt]'` a silent no-op.
[project.optional-dependencies]
dbt = [
    "dbt-metricflow>=0.10.1",
    "dbt-sl-sdk[sync]>=0.13.2",
]
databricks = [
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=4.4.0",
]
all = ["metric-breakdown[databricks,dbt]"]

[project.urls]
Homepage = "https://github.com/PolycultureResearch/breakdown"
Repository = "https://github.com/PolycultureResearch/breakdown"
Issues = "https://github.com/PolycultureResearch/breakdown/issues"
Changelog = "https://github.com/PolycultureResearch/breakdown/blob/main/CHANGELOG.md"

[project.scripts]
breakdown = "breakdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required, not cosmetic: hatchling infers the package directory from the
# distribution name, and `metric-breakdown` does not match `breakdown/`. Without
# this the wheel builds empty. It also pins what ships — the demo instance's
# tree and parquet snapshots live outside `breakdown/`, so they can never end up
# in a wheel by accident.
[tool.hatch.build.targets.wheel]
packages = ["breakdown"]

# The sdist otherwise mirrors the whole repo. Someone running `pip download` or
# building from source wants the package, its tests and its docs — not the demo
# instance's committed parquet, nor the agent/CI scaffolding.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.github",
    "/demo",
    "/dist",
    "/knowledge",
]

# Contributors get every provider, so a plain `uv sync` still runs the whole
# suite — the provider tests skip themselves when their SDK is absent, which is
# what keeps a base install testable, not what we want by default when working
# on the code. This is a development setting; it has no effect on `pip install`.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "metric-breakdown[all]",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Defaults (E4/E7/E9 pycodestyle errors + F pyflakes) plus import sorting.
extend-select = ["I"]
