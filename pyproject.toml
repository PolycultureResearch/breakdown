[project]
# Distribution name only. `breakdown` is taken on PyPI, so the project is
# published as `metric-breakdown` — but the import package stays `breakdown`
# and so does the CLI, because that is what the docs, the API and every tree
# YAML already say. A distribution name differing from its import name is
# ordinary (scikit-learn/sklearn, beautifulsoup4/bs4); the only cost is that
# `pip install` and `import` read differently, which the README now states up
# front.
name = "metric-breakdown"
version = "0.1.1"
description = "Bayesian metric trees: root cause analysis for business metrics over the dbt Semantic Layer"
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
authors = [{ name = "Polyculture Research" }]
keywords = [
    "analytics",
    "attribution",
    "bayesian",
    "causal-inference",
    "dbt",
    "metric-tree",
    "root-cause-analysis",
    "semantic-layer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # 3.14 covers the base package only — CI runs the whole suite there against
    # a no-extras install. The `dbt` extra does not work on 3.14 (dbt-core's
    # `mf` fails on import), which is precisely why it is an extra.
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
# The base install is the whole engine, API, UI, MCP server and the `mock`
# provider — the "just let me try it" path. Provider SDKs are extras (below),
# because carrying dbt-core and the Databricks connector for everyone tripled
# the install for dependencies most users never touch.
#
# Floors are the oldest release each dependency is actually exercised against,
# verified with `uv lock --resolution lowest-direct` + the full suite on 3.11 —
# not "whatever was current while developing". A library that pins high forces
# a resolver conflict on anyone whose stack is a few months behind.
dependencies = [
    # 0.22 is the first release that survives current matplotlib: earlier ones
    # touch `matplotlib.style.core`, removed in matplotlib 3.11, so an unbounded
    # `arviz<1.0.0` resolves to something that cannot be imported.
    "arviz>=0.22.0,<1.0.0",
    # Deliberately unbounded, and the ceiling that nearly landed here would have
    # been wrong. FastAPI 0.137.0 changed `include_router` to append one lazy
    # `_IncludedRouter` node per include instead of copying each route into the
    # parent, so `app.routes` stopped being a flat list of routes. That reads as
    # "the app lost twenty routes" to anything counting `.path` there — but
    # routing, the OpenAPI schema and the operation ids are unchanged. Measured
    # on 3.13 across 0.135.2, 0.136.0, 0.137.0, 0.138.0, 0.139.0, 0.140.0 and
    # 0.141.1, and cross-paired against starlette 1.0.0/1.1.0/1.2.0/1.6.0: all 25
    # paths and all 25 unique operation ids are present at every combination, and
    # starlette's version makes no difference at all. The double include this
    # package relies on (§2.16 — one router, mounted bare and under
    # `/trees/{tree_id}`) is supported throughout; `include_router` does not
    # mutate the router it is handed, which
    # `tests/test_project_invariants.py` now asserts alongside the mount
    # invariant itself. Pin only for a defect that survives that test.
    "fastapi>=0.115.0",
    # Genuinely 2.x: `mcp.server.MCPServer` and the streamable-HTTP session
    # manager breakdown/mcp/server.py builds on do not exist in mcp 1.x.
    # Deliberately **not** capped. 2.1.0 changed how a tool error reaches the
    # caller and turned six refusals opaque (roadmap C28); an upper bound would
    # have hidden that from CI while quietly denying users the current SDK, and
    # the `sdist` / `base-install` jobs — which resolve fresh rather than from
    # `uv.lock` — reported it within hours of the release. Keep the range open
    # and the lock current; that pair is the detector. Pin only for a defect
    # that the suite cannot be made to catch.
    "mcp>=2.0.0",
    "networkx>=3.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pymc>=5.16.0",
    "pyyaml>=6.0",
    "uvicorn>=0.27.0",
]

# Provider SDKs. Each one is needed only by the provider that uses it, and
# selecting a provider without its extra raises an error naming the exact
# `pip install` to run (breakdown/data_fetch.py) rather than an ImportError.
#
# `dbt` is also where the Python-version ceiling lives: dbt-core does not run on
# 3.14 (`mf` dies on import with a mashumaro serialization error). It is left
# unmarked rather than pinned to <3.14 so that failure stays visible: a marker
# would make `pip install 'metric-breakdown[dbt]'` a silent no-op.
[project.optional-dependencies]
dbt = [
    # >=0.13.0 pins metricflow==0.211.0, and the floor is still load-bearing —
    # though no longer for the reason it was set. `dbt-bridge` used to depend on
    # metricflow too, and 0.10.1's `metricflow==0.208.1` pin could not coexist
    # with it. That conflict is gone (dbt-bridge is sqlglot alone), but the dev
    # group installs both this extra and `metricflow>=0.211.0` for the manifest
    # oracle, so the old pin would still deadlock a contributor's environment.
    # It also widens support: 0.10.1 capped at Python <3.13, 0.13.0 at <3.14.
    "dbt-metricflow>=0.13.0",
    "dbt-sl-sdk[sync]>=0.13.2",
]
# Reading a dbt project's own semantic definitions. Deliberately NOT the `dbt`
# extra: this path needs neither dbt-core, an adapter, nor the `mf` binary —
# only the manifest `dbt parse` already wrote and a SQL generator.
#
# It also needs nothing from dbt Labs. `metricflow` used to be here, purely for
# `metricflow_semantic_interfaces`, and cost twelve transitive packages and a
# `<3.15` Python ceiling for a single `parse_obj` call. The manifest is a
# resolved JSON artifact rather than a language, so `breakdown/dbt_manifest.py`
# models the subset we read; `metricflow` stays in the dev group as a
# differential oracle (tests/test_dbt_manifest.py), which is what keeps owning
# the schema honest.
dbt-bridge = [
    "sqlglot>=20.0.0",
]
databricks = [
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=4.4.0",
]
# The `dbt` provider *generates* BigQuery SQL with no driver at all — only
# executing it needs one, and a project with `dbt-bigquery` beside it already
# has this. The extra exists for the deployment that runs breakdown away from
# the dbt install, which is the usual shape once snapshots are committed.
bigquery = [
    "google-cloud-bigquery>=3.11.0",
]
# `dbt` is marked, and the marker is load-bearing. Every `dbt-metricflow`
# release caps at `<3.14` (and everything before 0.12 at `<3.13`), as does
# `dbt-sl-sdk`, so an unmarked `all` is unresolvable on 3.14 — pip refuses the
# whole install rather than the one extra it cannot satisfy, which also denied a
# 3.14 user `databricks` and `dbt-bridge`, both of which work there.
#
# The `dbt` deps are spelled out rather than referenced as `metric-breakdown[dbt]`
# because hatchling **flattens self-referencing extras at build time and drops
# the marker** — the metadata came out as a bare `dbt-metricflow>=0.13.0;
# extra == 'all'` and 3.14 still failed. `test_packaging.py` pins these against
# the `dbt` extra so the duplication cannot drift.
#
# Deliberately NOT the same call as marking the `dbt` extra itself: asking for
# `[dbt]` on 3.14 should still fail loudly, and pip's resolver error names the
# offending package. `[all]` means "everything installable here", so degrading
# is the honest reading.
all = [
    "metric-breakdown[bigquery,databricks,dbt-bridge]",
    "dbt-metricflow>=0.13.0; python_version < '3.14'",
    "dbt-sl-sdk[sync]>=0.13.2; python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/PolycultureResearch/breakdown"
Repository = "https://github.com/PolycultureResearch/breakdown"
Issues = "https://github.com/PolycultureResearch/breakdown/issues"
Changelog = "https://github.com/PolycultureResearch/breakdown/blob/main/CHANGELOG.md"
Documentation = "https://github.com/PolycultureResearch/breakdown/blob/main/docs/model.md"
Demo = "https://white-cube-demo.fly.dev/ui"

[project.scripts]
breakdown = "breakdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required, not cosmetic: hatchling infers the package directory from the
# distribution name, and `metric-breakdown` does not match `breakdown/`. Without
# this the wheel builds empty. It also pins what ships — the demo instance's
# tree and parquet snapshots live outside `breakdown/`, so they can never end up
# in a wheel by accident.
[tool.hatch.build.targets.wheel]
packages = ["breakdown"]

# The sdist otherwise mirrors the whole repo. Someone running `pip download` or
# building from source wants the package, its tests and its docs — not the demo
# instance's committed parquet, nor the agent/CI scaffolding.
#
# `tests/` ships, and two of its modules read files that live in directories
# excluded here (`knowledge/b2b_mrr_tree.yml`, `demo/.breakdown/snapshots`).
# Both guard themselves with a module-level `skipif`, so the shipped suite
# skips them with a reason instead of failing on a file the artifact never
# contained; the `sdist` CI job runs the suite from an unpacked sdist and
# asserts on those reasons. Excluding a directory that a test reads is
# therefore a decision with a second half — make the test skip too.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.github",
    # A `uv` interpreter pin for *this* checkout. Left in the sdist it silently
    # constrains anyone building from source to the version we happen to
    # develop on, which is narrower than `requires-python` promises.
    "/.python-version",
    # A symlink to AGENTS.md, and agent scaffolding by the same reading as
    # `/.claude`. Symlinks in an sdist are also a portability wart (they do not
    # survive extraction everywhere), and this one buys nothing: AGENTS.md is
    # right there.
    "/CLAUDE.md",
    "/demo",
    "/dist",
    # uv's lockfile pins the *development* environment — every extra plus the
    # dev group, so pymc, arviz, duckdb, metricflow, databricks and bigquery.
    # No installer reads it (pip builds an sdist through hatchling, which reads
    # `dependencies` above), so shipping it changes nothing about an install and
    # costs 212 KB of a 776 KB download. The real objection is what it implies:
    # this package is deliberately thin at its base, provider SDKs are optional
    # extras, and the `base-install` CI job exists to prove nothing
    # provider-specific is imported at module scope. A lockfile inside the
    # released artifact pinning all of it invites exactly the misreading that
    # job is there to prevent. Contributors get the lockfile from the repo,
    # where it is authoritative and current.
    "/uv.lock",
    "/knowledge",
]

# Contributors get every provider, so a plain `uv sync` still runs the whole
# suite — the provider tests skip themselves when their SDK is absent, which is
# what keeps a base install testable, not what we want by default when working
# on the code. This is a development setting; it has no effect on `pip install`.
[dependency-groups]
dev = [
    # Executes the SQL `dbt_sql.py` generates, so the generator is proven
    # against a real engine rather than string-matched. Test-only: no provider
    # depends on it, and it never ships in a wheel.
    "duckdb>=1.0.0",
    "httpx>=0.28.1",
    "metric-breakdown[all]",
    # Not a runtime dependency of anything. It is the oracle the in-tree
    # manifest models are checked against, so dbt changing the artifact fails a
    # test instead of reaching a user.
    "metricflow>=0.211.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

# Lockfile-only; none of this is published metadata.
#
# Lowering the numpy floor widens the resolver's search, and it will happily
# reach a numba beta to get there — 0.63.0b1 still references `np.row_stack`,
# removed in numpy 2.0, so `import arviz` dies on a lockfile that resolved
# "successfully". pip does not consider prereleases by default, so this only
# ever bit `uv sync`; saying so here keeps the development lockfile honest
# about what users actually get.
[tool.uv]
prerelease = "disallow"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Defaults (E4/E7/E9 pycodestyle errors + F pyflakes) plus import sorting.
extend-select = ["I"]
