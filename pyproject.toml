[project]
name = "breakdown"
version = "0.1.0"
description = "Bayesian metric trees: root cause analysis for business metrics over the dbt Semantic Layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz<1.0.0",
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=4.4.0",
    "dbt-metricflow>=0.10.1",
    "dbt-sl-sdk[sync]>=0.13.2",
    "fastapi>=0.135.2",
    "mcp>=2.0.0",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.12.5",
    "pymc>=5.28.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Defaults (E4/E7/E9 pycodestyle errors + F pyflakes) plus import sorting.
extend-select = ["I"]
